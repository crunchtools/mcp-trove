[project]
name = "mcp-trove-crunchtools"
version = "0.6.0"
description = "Self-hosted local file indexing MCP server with semantic search"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "rag", "semantic-search", "embeddings", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "fastembed>=0.4",
    "sqlite-vec>=0.1",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.0",
]

[project.optional-dependencies]
vision-gemini = ["google-genai>=1.0"]
vision-openai = ["openai>=1.0"]
vision = ["google-genai>=1.0", "openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-trove-crunchtools = "mcp_trove_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trove_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    # S310: the only urlopen call targets a hardcoded "http://localhost:11434"
    # (Ollama's local API) -- never derived from user/env input, so no
    # scheme-injection is possible. Verified by removing this ignore and
    # confirming the only two hits are that hardcoded call.
    "S310",
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# S101 (assert) and S105 (hardcoded-password-like literals) are genuinely
# test-only. PLC0415 and PLR2004 were checked here too but no longer fire --
# kept for visibility if test code grows to need them again.
"tests/*" = ["S101", "S105", "PLC0415", "PLR2004", "ARG002"]
# TRY003 (long exception messages) and PLW0603 (global statement) fire only
# here: ConfigurationError-style errors take a full formatted message per
# call, and get_config is a lazy singleton needing `global`.
"src/mcp_trove_crunchtools/config.py" = ["TRY003", "PLW0603"]
# S608: query_errors()'s WHERE clause is built from hardcoded strings only
# ("resolved = ?", "path LIKE ?") -- every user-controlled value is bound via
# the params tuple through ? placeholders, never interpolated into the SQL
# text itself. Previously an inline # noqa; moved here because gourmand's
# own EV001-lint_suppression check flags inline noqa on sight.
"src/mcp_trove_crunchtools/database.py" = ["PLW0603", "S608"]
# PLC0415: fastembed is a heavy ONNX-runtime dependency; deferring the import
# keeps `get_model()` cheap to import when embeddings aren't needed yet.
# PLW0603: get_model is a lazy singleton needing `global`.
"src/mcp_trove_crunchtools/embedder.py" = ["PLC0415", "PLW0603"]
# PLC0415: __init__.py's main()/_run_index() defer every internal import so
# `import mcp_trove_crunchtools` (or a submodule import that runs this file
# first) stays cheap -- it does not pull in the full FastMCP server and tool
# registration graph unless the CLI entry point actually runs.
"src/mcp_trove_crunchtools/__init__.py" = ["PLC0415"]
# PLC0415: pymupdf4llm/python-docx/PIL are optional per-format dependencies,
# each guarded by try/except ImportError -- a user who never processes PDFs
# should not need pymupdf4llm installed. The .vision import is deferred
# specifically so tests can `patch("mcp_trove_crunchtools.vision.get_backend")`
# and have it take effect (a hoisted `from .vision import get_backend` binds
# the name at import time, before the patch, and the wire-up here is on the
# hot path of every extraction call so re-importing per call is deliberate).
"src/mcp_trove_crunchtools/extractor.py" = ["PLC0415"]
# PLC0415: google-genai and openai are optional per-backend SDKs, each
# guarded by try/except ImportError -- a user who only configured Ollama
# should not need either installed. PLW0603: get_backend/reset_backend use
# a lazy singleton needing `global`.
"src/mcp_trove_crunchtools/vision.py" = ["PLC0415", "PLW0603"]
# TID252: the tools/ subpackage imports its parent package's modules
# (database, config, errors) with ".." -- this package's consistent style
# for that one subpackage, verified by removing the ignore (10 hits, all in
# these 3 files, none anywhere else in the project).
"src/mcp_trove_crunchtools/tools/*" = ["TID252"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fastembed", "pymupdf4llm", "docx", "sqlite_vec", "google", "google.genai", "openai", "PIL", "PIL.ExifTags"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
