# a472 throwaway: probe /proc in nested containers on the Exedore cached pool.
# Never merge.
name: a472 repro
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: crunchtools-cached
    timeout-minutes: 20
    steps:
      - name: probe
        run: |
          say() { echo "A472: $*"; }
          say "runner=$RUNNER_NAME podman=$(podman version --format '{{.Client.Version}}') crun=$(crun --version | head -1) kernel=$(uname -r)"
          say "outer pid=$$ proc-mounts: $(awk '$5 ~ /^\/proc/ {printf "%s(%s) ", $5, $9}' /proc/self/mountinfo)"
          say "outer masked-count=$(awk '$5 ~ /^\/proc\// {n++} END{print n+0}' /proc/self/mountinfo)"
          img=quay.io/crunchtools/sdlc:latest
          podman pull -q "$img" >/dev/null 2>&1 || say "pull failed"
          probe='p=$$; if [ -e /proc/$p ]; then v=OK; else v=MISMATCH; fi; echo "pid=$p self=$(readlink /proc/self) proc/$p=$v procfs=$(awk "\$5==\"/proc\"{print \$9\" \"\$4}" /proc/self/mountinfo)"'
          say "plain:   $(podman run --rm --entrypoint sh "$img" -c "$probe" 2>&1 | tail -1)"
          say "gateflags: $(podman run --rm --cap-drop=all --security-opt=no-new-privileges --cpus 2 --memory 8g --entrypoint sh "$img" -c "$probe" 2>&1 | tail -1)"
          say "pidhost: $(podman run --rm --pid=host --entrypoint sh "$img" -c "$probe" 2>&1 | tail -1)"
          say "psutil: $(podman run --rm --entrypoint sh "$img" -c 'uvx -q --from psutil python -c "import psutil,os;print(os.getpid(),psutil.Process().cpu_affinity())" 2>&1 | tail -1' 2>&1 | tail -1)"
          say "crun-debug: $(podman --log-level=debug run --rm --entrypoint true "$img" 2>&1 | grep -iE 'proc|mount.*EPERM|fallback' | head -3 | tr '\n' ' ')"
          exit 1
