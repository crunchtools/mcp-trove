[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "Reviewed each global ignore by removing it and running ruff (not by trusting comments). TRY003, PLR0913, PLR2004, PIE790, PLC0415, S105, RUF022 all had zero remaining hits and were deleted outright -- dead config. S101, PLW0603, and the rest were verified to fire only in specific files/dirs and rescoped to per-file-ignores accordingly (see the per-entry comments in the per-file-ignores table for each rule's specific justification: config.py/database.py/embedder.py/vision.py for PLW0603 lazy singletons, embedder.py/__init__.py/extractor.py/vision.py for PLC0415 optional-dependency and CLI-lazy imports, tools/* for TID252's parent-package imports, database.py for the S608 query that was previously an inline noqa (moved here because gourmand's own EV001-lint_suppression flags inline noqa)). S310 is the only global ignore, verified to cover exactly the one hardcoded localhost:11434 Ollama call, never derived from external input."
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "src/mcp_trove_crunchtools/config.py"
justification = "All 12 vars (TROVE_DB, TROVE_PATHS, TROVE_INDEX_WORKERS, TROVE_INDEX_BATCH, TROVE_EMBEDDING_MODEL, TROVE_EXCLUDE_PATTERNS, TROVE_CHUNK_SIZE, TROVE_CHUNK_OVERLAP, TROVE_VISION_BACKEND, TROVE_VISION_MODEL, TROVE_VISION_PROMPT, TROVE_VISION_TIMEOUT) are documented in README.md's Environment Variables table with defaults verified line-by-line against this file's actual DEFAULT_* constants and os.environ.get() fallbacks -- including TROVE_INDEX_WORKERS, confirmed to read 20 here and 20 in the README (an earlier documentation pass had this wrong as 2 before gourmand 0.1.0 predated this check)."
classification = "by_design"

[[exceptions]]
check = "dead_structs"
path = "src/mcp_trove_crunchtools/vision.py"
justification = "GeminiBackend, OpenAIBackend and OllamaBackend are constructed dynamically in get_backend() via a name-to-class dict (backends[cfg.vision_backend](cfg.vision_model, cfg.vision_prompt)) rather than a literal ClassName(...) call the check's static analysis can match. The construction site is real; this is dynamic dispatch, not dead code."
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trove_crunchtools/extractor.py"
justification = "_get_supported_extensions (build a set of file extensions) and _extract_video (caption a video via the vision backend) are semantically unrelated; the 99%-similar match is a coincidental structural collision -- both happen to call get_backend() and check `is None` in a short function body, not real copy-paste."
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trove_crunchtools/vision.py"
justification = "OpenAIBackend.caption and OllamaBackend.caption both implement the same caption(path, file_type) interface for a different vision provider (OpenAI's SDK vs. a raw HTTP call to local Ollama); the video-not-supported guard clause and overall shape are the interface, which is the point of having multiple backends."
classification = "by_design"

[[exceptions]]
check = "unsafe_sql_construction"
path = "src/mcp_trove_crunchtools/database.py"
justification = "query_errors()'s WHERE clause is built from hardcoded strings only ('resolved = ?', 'path LIKE ?') -- every user-controlled value (resolved, path) is bound via the params tuple through ? placeholders, never interpolated into the SQL text itself. Same verified pattern as the S608 ruff ignore scoped to this file."
classification = "by_design"
